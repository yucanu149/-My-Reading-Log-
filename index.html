            '月面で発見された5万年前の人間の遺体という謎に対し、科学者たちがどのように仮説を立て、反証し、真実に迫っていくのか。ハードSFの傑作を楽しみながら科学的思考のプロセスを味わいたい。',
          summary:
            '月面で真紅の宇宙服を着た5万年前の人類の遺体が発見される。矛盾する数々の観測事実を前に、各分野の科学者たちが既成概念を乗り越えて壮大な仮説を検証していくハードSFミステリー。',
          quotes: [],
          overallReview: '',
          critique: '',
          actionPlan:
            '今週末の土曜午前、カフェでスマートフォンを機内モードにして第1章からじっくり読み始める。',
          actionReview: '',
          essence: '',
          createdAt: '2026-11-02T10:00:00.000Z',
          updatedAt: '2026-11-02T10:00:00.000Z'
        }
      ];

      function normalizeBook(rawBook) {
        if (!rawBook || typeof rawBook !== 'object') return null;

        const sampleMatch = INITIAL_BOOKS.find((s) => s.id === rawBook.id);

        let quotes = [];
        if (Array.isArray(rawBook.quotes)) {
          quotes = rawBook.quotes
            .filter((q) => q && typeof q === 'object')
            .map((q) => ({
              page: typeof q.page === 'string' ? q.page.trim() : '',
              quote: typeof q.quote === 'string' ? q.quote.trim() : '',
              thought: typeof q.thought === 'string' ? q.thought.trim() : ''
            }))
            .filter((q) => q.page !== '' || q.quote !== '' || q.thought !== '');
        } else {
          const legacyPage =
            typeof rawBook.favoritePage === 'string' ? rawBook.favoritePage.trim() : '';
          const legacyQuote =
            typeof rawBook.favoriteQuote === 'string' ? rawBook.favoriteQuote.trim() : '';
          const legacyThought =
            typeof rawBook.myThoughts === 'string' ? rawBook.myThoughts.trim() : '';

          if (
            sampleMatch &&
            sampleMatch.quotes.length > 0 &&
            sampleMatch.quotes[0].quote === legacyQuote
          ) {
            quotes = sampleMatch.quotes;
          } else if (legacyPage || legacyQuote || legacyThought) {
            quotes = [{ page: legacyPage, quote: legacyQuote, thought: legacyThought }];
          }
        }

        let overallReview =
          typeof rawBook.overallReview === 'string' ? rawBook.overallReview : '';
        if (!overallReview && sampleMatch && sampleMatch.overallReview) {
          overallReview = sampleMatch.overallReview;
        }

        return {
          ...rawBook,
          tags: Array.isArray(rawBook.tags) ? rawBook.tags : [],
          quotes,
          overallReview,
          favoritePage: (quotes[0] && quotes[0].page) || '',
          favoriteQuote: (quotes[0] && quotes[0].quote) || '',
          myThoughts: (quotes[0] && quotes[0].thought) || ''
        };
      }

          accent: 'text-amber-300/90',
          text: 'text-stone-100',

      function getPaletteIndex(title = '') {
        let sum = 0;
        for (let i = 0; i < title.length; i++) {

        }
        return sum % PALETTES.length;
      }

      /* --- DailyHighlight Component --- */
      function DailyHighlight({ books, onSelectBook }) {
        const highlights = useMemo(() => {
          const list = [];
          books.forEach((rawBook) => {
            const book = normalizeBook(rawBook);
            if (!book) return;
            const bookQuotes = Array.isArray(book.quotes) ? book.quotes : [];
            bookQuotes.forEach((item, idx) => {
              if (item.quote && item.quote.trim() !== '') {
                list.push({
                  id: `${book.id}-quote-${idx}`,
                  bookId: book.id,
                  quote: item.quote.trim(),
                  thought: item.thought ? item.thought.trim() : '',
                  page: item.page ? item.page.trim() : '',
                  title: book.title,
                  author: book.author,
                  book
                });
              }
            });
          });
          return list;
        }, [books]);

        const [currentIndex, setCurrentIndex] = useState(0);
        const [isSpinning, setIsSpinning] = useState(false);

        useEffect(() => {
          if (highlights.length > 0) {
            setCurrentIndex(Math.floor(Math.random() * highlights.length));
          }
        }, [highlights.length]);

        if (highlights.length === 0) {
          return (
            <section className="mb-8 rounded-2xl border border-stone-200/90 bg-gradient-to-br from-stone-50 via-amber-50/30 to-stone-100/80 p-6 shadow-sm">
              <div className="flex items-center gap-2 text-amber-800 text-xs font-medium tracking-wider uppercase mb-2">
                <Sparkles className="w-4 h-4 text-amber-600" />
                <span>本日のハイライト（デイリー復習カード）</span>
              </div>
              <p className="text-stone-600 text-sm leading-relaxed">
                まだ「好きな文章」が登録されていません。本を記録すると、複数登録した好きな文章の中からランダムに1つがここに表示され、日々の思考と行動の振り返りに役立ちます。
              </p>
            </section>
          );
        }

        const current = highlights[currentIndex % highlights.length] || highlights[0];

        const handleReshuffle = () => {
          setIsSpinning(true);
          setTimeout(() => setIsSpinning(false), 350);
          if (highlights.length <= 1) return;
          let next = Math.floor(Math.random() * highlights.length);
          if (next === currentIndex % highlights.length) {
            next = (currentIndex + 1) % highlights.length;
          }
          setCurrentIndex(next);
        };

        return (
          <section
            aria-label="本日のハイライト"
            className="mb-8 relative overflow-hidden rounded-2xl border border-stone-200/90 bg-gradient-to-br from-[#FAF8F5] via-[#FDFBF7] to-amber-50/40 p-6 sm:p-7 shadow-sm transition-all"
          >
            <Quote className="w-28 h-28 text-stone-200/50 absolute -right-3 -bottom-4 pointer-events-none select-none rotate-6" />

            <div className="relative z-10 flex flex-wrap items-center justify-between gap-3 mb-4">
              <div className="flex items-center gap-2.5">
                <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-100/80 text-amber-900 border border-amber-200/70">
                  <Sparkles className="w-3.5 h-3.5 text-amber-700" />
                  本日のハイライト
                </span>
                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-stone-100 text-stone-700 border border-stone-200">
                  <Quote className="w-3 h-3 text-stone-500" />
                  好きな文章（全 {highlights.length} 件から抽選）
                </span>
              </div>

              <button
                type="button"
                onClick={handleReshuffle}
                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-stone-700 bg-white/90 hover:bg-stone-100 border border-stone-200/90 shadow-xs transition cursor-pointer active:scale-95"
              >
                <RefreshCw
                  className={`w-3.5 h-3.5 text-stone-500 transition-transform duration-300 ${
                    isSpinning ? 'rotate-180' : ''
                  }`}
                />
                別のフレーズを見る
              </button>
            </div>

            <blockquote className="relative z-10 my-3 pl-4 border-l-2 border-amber-600/70">
              <p className="font-serif font-semibold text-base sm:text-lg text-stone-800 leading-relaxed tracking-wide">
                「{current.quote}」
              </p>
            </blockquote>

            {current.thought && (
              <div className="relative z-10 mt-3 rounded-xl bg-white/80 border border-stone-200/70 px-4 py-2.5 flex items-start gap-2.5">
                <Lightbulb className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                <p className="text-xs sm:text-sm text-stone-600 leading-relaxed line-clamp-2">
                  {current.thought}
                </p>
              </div>
            )}

            <div className="relative z-10 mt-4 pt-3 border-t border-stone-200/60 flex flex-wrap items-center justify-between gap-2 text-xs text-stone-600">
              <div className="flex flex-wrap items-center gap-x-2 gap-y-1">
                <span className="font-medium text-stone-800 font-serif">『{current.title}』</span>
                {current.author && <span className="text-stone-500">/ {current.author}</span>}
                {current.page && (
                  <span className="px-2 py-0.5 rounded bg-amber-100/80 text-amber-900 border border-amber-200/80 font-mono text-[11px]">
                    {current.page}
                  </span>

              </div>

              <button
                type="button"

                <ArrowUpRight className="w-3.5 h-3.5" />

            </div>
          </section>
        );
      }

      /* --- BookFormModal Component --- */
      function getTodayStr() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function createEmptyQuoteSet() {
        return { page: '', quote: '', thought: '' };
      }

      function readImageAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
          reader.onload = (e) => {
            const rawDataUrl = e.target.result;
            const img = new Image();
            img.onload = () => {
              const MAX_WIDTH = 600;
              const MAX_HEIGHT = 900;
              let { width, height } = img;

              if (width <= MAX_WIDTH && height <= MAX_HEIGHT && file.size <= 350 * 1024) {
                resolve(rawDataUrl);
                return;
              }

              const ratio = Math.min(MAX_WIDTH / width, MAX_HEIGHT / height, 1);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);

              try {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.84);
                resolve(compressedDataUrl || rawDataUrl);
              } catch (err) {
                resolve(rawDataUrl);
              }
            };
            img.onerror = () => resolve(rawDataUrl);
            img.src = rawDataUrl;
          };
          reader.readAsDataURL(file);
        });
      }

      function BookFormModal({ isOpen, onClose, onSave, initialData }) {
        const isEditing = Boolean(initialData && initialData.id);
        const fileInputRef = useRef(null);

        const [title, setTitle] = useState('');
        const [author, setAuthor] = useState('');
        const [publishedDate, setPublishedDate] = useState('');
        const [pageCount, setPageCount] = useState('');
        const [readDate, setReadDate] = useState(getTodayStr());
        const [status, setStatus] = useState('読了');
        const [tagsInput, setTagsInput] = useState('');
        const [coverUrl, setCoverUrl] = useState('');

        const [preQuestion, setPreQuestion] = useState('');
        const [summary, setSummary] = useState('');
        const [quotes, setQuotes] = useState([createEmptyQuoteSet()]);
        const [overallReview, setOverallReview] = useState('');
        const [critique, setCritique] = useState('');
        const [actionPlan, setActionPlan] = useState('');
        const [actionReview, setActionReview] = useState('');
        const [essence, setEssence] = useState('');

        const [isEssenceOpen, setIsEssenceOpen] = useState(false);
        const [titleError, setTitleError] = useState('');
        const [imageError, setImageError] = useState('');
        const [isDragging, setIsDragging] = useState(false);

        useEffect(() => {
          if (!isOpen) return;
          setTitleError('');
          setImageError('');
          setIsDragging(false);

          if (initialData) {
            const normalized = normalizeBook(initialData);
            setTitle(normalized.title || '');
            setAuthor(normalized.author || '');
            setPublishedDate(normalized.publishedDate || '');
            setPageCount(normalized.pageCount ? String(normalized.pageCount) : '');
            setReadDate(normalized.readDate || getTodayStr());
            setStatus(normalized.status || '読了');
            setTagsInput(Array.isArray(normalized.tags) ? normalized.tags.join(', ') : '');
            setCoverUrl(normalized.coverUrl || '');
            setPreQuestion(normalized.preQuestion || '');
            setSummary(normalized.summary || '');
            setQuotes(
              Array.isArray(normalized.quotes) && normalized.quotes.length > 0
                ? normalized.quotes.map((q) => ({
                    page: q.page || '',
                    quote: q.quote || '',
                    thought: q.thought || ''
                  }))
                : [createEmptyQuoteSet()]
            );
            setOverallReview(normalized.overallReview || '');
            setCritique(normalized.critique || '');
            setActionPlan(normalized.actionPlan || '');
            setActionReview(normalized.actionReview || '');
            setEssence(normalized.essence || '');
            setIsEssenceOpen(Boolean(normalized.essence && normalized.essence.trim() !== ''));
          } else {
            setTitle('');
            setAuthor('');
            setPublishedDate('');
            setPageCount('');
            setReadDate(getTodayStr());
            setStatus('読了');
            setTagsInput('');
            setCoverUrl('');
            setPreQuestion('');
            setSummary('');
            setQuotes([createEmptyQuoteSet()]);
            setOverallReview('');
            setCritique('');
            setActionPlan('');
            setActionReview('');
            setEssence('');
            setIsEssenceOpen(false);
          }
        }, [isOpen, initialData]);

        if (!isOpen) return null;

        const parsedTags = tagsInput
          .split(/[,、\s]+/)
          .map((t) => t.trim())
          .filter(Boolean);

        const handleTogglePresetTag = (tag) => {
          if (parsedTags.includes(tag)) {
            const next = parsedTags.filter((t) => t !== tag);
            setTagsInput(next.join(', '));
          } else {
            const next = [...parsedTags, tag];
            setTagsInput(next.join(', '));
          }
        };

        const handleQuoteChange = (index, field, value) => {
          setQuotes((prev) =>
            prev.map((item, i) => (i === index ? { ...item, [field]: value } : item))
          );
        };

        const handleAddQuoteSet = () => {
          setQuotes((prev) => [...prev, createEmptyQuoteSet()]);
        };

        const handleRemoveQuoteSet = (index) => {
          setQuotes((prev) => {
            if (prev.length <= 1) return prev;
            return prev.filter((_, i) => i !== index);
          });
        };

        const processSelectedFile = async (file) => {
          if (!file) return;
          if (!file.type || !file.type.startsWith('image/')) {
            setImageError('画像ファイル（JPG / PNG / WebP / HEIC 等）を選択してください。');
            return;
          }
          setImageError('');
          try {
            const dataUrl = await readImageAsDataUrl(file);
            setCoverUrl(dataUrl);
          } catch (err) {
            setImageError('画像の読み込みに失敗しました。別の画像をお試しください。');
          }
        };

        const handleFileChange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) {
            processSelectedFile(file);
          }
          e.target.value = '';
        };

        const handleDragOver = (e) => {
          e.preventDefault();
          e.stopPropagation();
          setIsDragging(true);
        };

        const handleDragLeave = (e) => {
          e.preventDefault();
          e.stopPropagation();
          setIsDragging(false);
        };

        const handleDrop = (e) => {
          e.preventDefault();
          e.stopPropagation();
          setIsDragging(false);
          const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (file) {
            processSelectedFile(file);
          }
        };

        const handleClearImage = () => {
          setCoverUrl('');
          setImageError('');
          if (fileInputRef.current) {
            fileInputRef.current.value = '';
          }
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!title.trim()) {
            setTitleError('タイトルを入力してください');
            return;
          }

          const uniqueTags = Array.from(
            new Set(
              tagsInput
                .split(/[,、]+/)
                .map((t) => t.trim())
                .filter(Boolean)
            )
          );

          const cleanedQuotes = quotes
            .map((q) => ({
              page: (q.page || '').trim(),
              quote: (q.quote || '').trim(),
              thought: (q.thought || '').trim()
            }))
            .filter((q) => q.page !== '' || q.quote !== '' || q.thought !== '');

          const nowIso = new Date().toISOString();
          const record = {
            id:
              (initialData && initialData.id) ||
              `book-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            title: title.trim(),
            author: author.trim(),
            publishedDate: publishedDate.trim(),
            pageCount: pageCount.trim(),
            readDate: readDate || getTodayStr(),
            status,
            tags: uniqueTags,
            coverUrl: coverUrl.trim(),
            preQuestion: preQuestion.trim(),
            summary: summary.trim(),
            quotes: cleanedQuotes,
            overallReview: overallReview.trim(),
            favoritePage: (cleanedQuotes[0] && cleanedQuotes[0].page) || '',
            favoriteQuote: (cleanedQuotes[0] && cleanedQuotes[0].quote) || '',
            myThoughts: (cleanedQuotes[0] && cleanedQuotes[0].thought) || '',
            critique: critique.trim(),
            actionPlan: actionPlan.trim(),
            actionReview: actionReview.trim(),
            essence: essence.trim(),
            createdAt: (initialData && initialData.createdAt) || nowIso,
            updatedAt: nowIso
          };

          onSave(record);
        };

        return (
          <div
            className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/60 backdrop-blur-sm p-3 sm:p-6 overflow-y-auto"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-form-title"
          >
            <div className="relative w-full max-w-4xl max-h-[92vh] flex flex-col rounded-2xl bg-[#FAF8F5] border border-stone-200 shadow-2xl overflow-hidden my-auto">
              <div className="flex items-center justify-between px-6 py-4 bg-white/90 border-b border-stone-200/80">
                <div>
                  <span className="text-[11px] font-mono uppercase tracking-widest text-amber-800">
                    {isEditing ? 'EDIT READING LOG' : 'NEW READING LOG'}
                  </span>
                  <h2
                    id="modal-form-title"
                    className="text-lg sm:text-xl font-serif font-bold text-stone-900"
                  >
                    {isEditing ? '読書記録を編集する' : '新しい本を記録する'}
                  </h2>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  className="p-2 rounded-full text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition cursor-pointer"

                  <div className="flex items-center gap-2 border-b border-stone-100 pb-3">
                    <span className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-stone-800 text-stone-50 text-xs font-bold">
                      1
                    </span>
                    <BookOpen className="w-4 h-4 text-amber-700" />
                    <h3 className="font-serif font-bold text-stone-800 text-base">本の情報</h3>
                  </div>

                  <div className="flex flex-col md:flex-row gap-6">
                    <div className="w-full md:w-52 shrink-0 flex flex-col items-center">
                      <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*"
                        onChange={handleFileChange}
                        className="hidden"

                      <div
                        onDragOver={handleDragOver}
                        onDragLeave={handleDragLeave}
                        onDrop={handleDrop}
                        onClick={() => fileInputRef.current && fileInputRef.current.click()}

        読みたい: 'bg-indigo-100/80 text-indigo-900 border-indigo-300/80'
      };

      function BookDetailModal({ book: rawBook, onClose, onEdit, onDelete, onQuickUpdate }) {
        const [confirmDelete, setConfirmDelete] = useState(false);
        const [quickReview, setQuickReview] = useState('');
        const [isQuickEditingReview, setIsQuickEditingReview] = useState(false);
        const [savedToast, setSavedToast] = useState(false);

        const book = rawBook ? normalizeBook(rawBook) : null;

        useEffect(() => {
          setConfirmDelete(false);
          setIsQuickEditingReview(false);
          setQuickReview((rawBook && rawBook.actionReview) || '');
          setSavedToast(false);
        }, [rawBook]);

        if (!book) return null;

        const handleQuickReviewSave = () => {
          if (!onQuickUpdate) return;
          onQuickUpdate({
            ...book,
            actionReview: quickReview.trim(),
            updatedAt: new Date().toISOString()
          });
          setIsQuickEditingReview(false);
          setSavedToast(true);
          setTimeout(() => setSavedToast(false), 2000);
        };

        const handleStatusChange = (nextStatus) => {
          if (!onQuickUpdate || nextStatus === book.status) return;
          onQuickUpdate({
            ...book,
            status: nextStatus,
            updatedAt: new Date().toISOString()
          });
        };

        const quotesList = Array.isArray(book.quotes) ? book.quotes : [];

        return (
          <div

                  <div className="rounded-xl bg-emerald-50/40 border border-emerald-200/90 p-5 shadow-sm flex flex-col justify-between">

      /* --- Main App Component --- */
      const STATUS_TABS = ['すべて', '読みたい', '読書中', '読了'];

      function App() {
        const [books, setBooks] = useState(() => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed) && parsed.length > 0) {
                return parsed.map(normalizeBook).filter(Boolean);
              }
            }
          } catch (e) {}
          return INITIAL_BOOKS.map(normalizeBook).filter(Boolean);
        });

        const [searchQuery, setSearchQuery] = useState('');
        const [statusFilter, setStatusFilter] = useState('すべて');
        const [selectedTag, setSelectedTag] = useState('すべて');

        const [selectedBookId, setSelectedBookId] = useState(null);
        const [isFormOpen, setIsFormOpen] = useState(false);
        const [editingBook, setEditingBook] = useState(null);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
          } catch (e) {}
        }, [books]);

        const selectedBook = useMemo(
          () => books.find((b) => b.id === selectedBookId) || null,
          [books, selectedBookId]
        );

        const allTags = useMemo(() => {
          const set = new Set();
          books.forEach((b) => {
            if (Array.isArray(b.tags)) {
              b.tags.forEach((t) => {
                if (t && t.trim()) set.add(t.trim());
              });
            }
          });
          return ['すべて', ...Array.from(set)];
        }, [books]);

        const statusCounts = useMemo(() => {
          const counts = { すべて: books.length, 読みたい: 0, 読書中: 0, 読了: 0 };
          books.forEach((b) => {
            if (counts[b.status] !== undefined) {
              counts[b.status] += 1;
            }
          });
          return counts;
        }, [books]);

        const filteredBooks = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          return books.filter((book) => {
            const matchesStatus =
              statusFilter === 'すべて' || book.status === statusFilter;
            const matchesTag =
              selectedTag === 'すべて' ||
              (Array.isArray(book.tags) && book.tags.includes(selectedTag));
            const matchesQuery =
              !q ||
              (book.title && book.title.toLowerCase().includes(q)) ||
              (book.author && book.author.toLowerCase().includes(q)) ||
              (book.summary && book.summary.toLowerCase().includes(q)) ||
              (book.overallReview && book.overallReview.toLowerCase().includes(q)) ||
              (book.essence && book.essence.toLowerCase().includes(q)) ||
              (Array.isArray(book.quotes) &&
                book.quotes.some(
                  (item) =>
                    (item.quote && item.quote.toLowerCase().includes(q)) ||
                    (item.thought && item.thought.toLowerCase().includes(q))
                )) ||
              (Array.isArray(book.tags) &&
                book.tags.some((t) => t.toLowerCase().includes(q)));

            return matchesStatus && matchesTag && matchesQuery;
          });
        }, [books, searchQuery, statusFilter, selectedTag]);

        const handleOpenCreate = () => {
          setEditingBook(null);
          setIsFormOpen(true);
        };

        const handleOpenEdit = (book) => {
          setSelectedBookId(null);
          setEditingBook(book);
          setIsFormOpen(true);
        };

        const handleSaveBook = (savedBook) => {
          const normalized = normalizeBook(savedBook);
          setBooks((prev) => {
            const exists = prev.some((b) => b.id === normalized.id);
            if (exists) {
              return prev.map((b) => (b.id === normalized.id ? normalized : b));
            }
            return [normalized, ...prev];
          });
          setIsFormOpen(false);
          setEditingBook(null);
          setSelectedBookId(normalized.id);
        };

        const handleQuickUpdate = (updatedBook) => {
          const normalized = normalizeBook(updatedBook);
          setBooks((prev) =>
            prev.map((b) => (b.id === normalized.id ? normalized : b))
          );
        };

        const handleDeleteBook = (bookId) => {
          setBooks((prev) => prev.filter((b) => b.id !== bookId));
          setSelectedBookId(null);
        };

        const handleRestoreSamples = () => {
          setBooks(INITIAL_BOOKS.map(normalizeBook).filter(Boolean));
          setSearchQuery('');
          setStatusFilter('すべて');
          setSelectedTag('すべて');
        };

        return (
          <div className="min-h-screen bg-[#F6F4F0] text-stone-800 flex flex-col selection:bg-amber-200/70 selection:text-stone-900">
            {/* Header */}
            <header className="sticky top-0 z-30 bg-[#F6F4F0]/90 backdrop-blur-md border-b border-stone-200/80">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4 py-3.5">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-stone-900 text-amber-100 flex items-center justify-center shadow-sm">
                    <BookOpen className="w-5 h-5" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="font-serif text-xl sm:text-2xl font-bold text-stone-900 tracking-tight">
                        私の読書記録
                      </h1>
                      <span className="hidden sm:inline-block text-[11px] font-mono uppercase tracking-widest text-stone-400">
                        My Reading Log
                      </span>
                    </div>
                    <p className="text-xs text-stone-500 hidden sm:block">
                      知識のインプットを、多角的な思考と具体的な行動定着へつなげる読書ノート
                    </p>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={handleOpenCreate}
                  className="inline-flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-amber-50 text-xs sm:text-sm font-medium shadow-sm transition cursor-pointer active:scale-95 shrink-0"
                >
                  <Plus className="w-4 h-4 text-amber-300" />
                  <span>+ 新しい本を記録する</span>
                </button>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-7">
              <DailyHighlight
                books={books}
                onSelectBook={(book) => setSelectedBookId(book.id)}
              />

              {/* Search & Filter Bar */}
              <section
                aria-label="検索とフィルター"
                className="mb-7 rounded-2xl bg-white/90 border border-stone-200/90 p-4 sm:p-5 shadow-sm space-y-4"
              >
                <div className="flex flex-col md:flex-row gap-3 md:items-center justify-between">
                  <div className="relative flex-1">
                    <Search className="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="タイトル・著者名・好きな文章・感想キーワードで検索..."
                      className="w-full pl-10 pr-9 py-2 rounded-xl border border-stone-200 bg-stone-50/70 text-sm text-stone-900 placeholder:text-stone-400 focus:border-amber-700 focus:bg-white focus:outline-none transition"
                    />
                    {searchQuery && (
                      <button
                        type="button"
                        onClick={() => setSearchQuery('')}
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 p-1 text-stone-400 hover:text-stone-700 cursor-pointer"
                        aria-label="検索クリア"
                      >
                        <X className="w-3.5 h-3.5" />
                      </button>
                    )}
                  </div>

                  <div className="flex items-center gap-1 p-1 rounded-xl bg-stone-100 border border-stone-200/80 overflow-x-auto">
                    {STATUS_TABS.map((tab) => {
                      const active = statusFilter === tab;
                      return (
                        <button
                          key={tab}
                          type="button"
                          onClick={() => setStatusFilter(tab)}
                          className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition cursor-pointer ${
                            active
                              ? 'bg-stone-900 text-amber-50 shadow-xs'
                              : 'text-stone-600 hover:text-stone-900 hover:bg-stone-200/50'
                          }`}
                        >
                          <span>{tab}</span>
                          <span
                            className={`text-[10px] px-1.5 py-0.2 rounded-full ${
                              active
                                ? 'bg-stone-700 text-amber-200'
                                : 'bg-stone-200/80 text-stone-600'
                            }`}
                          >
                            {statusCounts[tab] ?? 0}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="flex items-center gap-1.5 flex-wrap pt-1 border-t border-stone-100">
                  <span className="inline-flex items-center gap-1 text-xs text-stone-500 mr-1">
                    <Tag className="w-3.5 h-3.5 text-stone-400" />
                    カテゴリ:
                  </span>
                  {allTags.map((tag) => {
                    const active = selectedTag === tag;
                    return (
                      <button
                        key={tag}
                        type="button"
                        onClick={() => setSelectedTag(tag)}
                        className={`px-2.5 py-1 rounded-full text-xs font-medium transition cursor-pointer border ${
                          active
                            ? 'bg-amber-800 text-white border-amber-800 shadow-xs'
                            : 'bg-stone-50 text-stone-600 border-stone-200/90 hover:bg-stone-100'
                        }`}
                      >
                        {tag === 'すべて' ? 'すべて' : `#${tag}`}
                      </button>
                    );
                  })}
                </div>
              </section>

              {/* Book Cards Grid */}
              {filteredBooks.length === 0 ? (
                <div className="rounded-2xl border border-dashed border-stone-300 bg-white/60 p-12 text-center space-y-4">
                  <BookOpen className="w-10 h-10 text-stone-400 mx-auto" />
                  <div className="space-y-1">
                    <h3 className="font-serif text-lg font-bold text-stone-800">
                      該当する読書記録が見つかりませんでした
                    </h3>
                    <p className="text-xs sm:text-sm text-stone-500">
                      検索条件やフィルターを変更するか、新しい本を記録してみてください。
                    </p>
                  </div>
                  <div className="flex flex-wrap items-center justify-center gap-3 pt-2">
                    {(searchQuery ||
                      statusFilter !== 'すべて' ||
                      selectedTag !== 'すべて') && (
                      <button
                        type="button"
                        onClick={() => {
                          setSearchQuery('');
                          setStatusFilter('すべて');
                          setSelectedTag('すべて');
                        }}
                        className="px-4 py-2 rounded-xl text-xs font-medium bg-stone-200/80 hover:bg-stone-300/80 text-stone-800 transition cursor-pointer"
                      >
                        フィルターをリセット
                      </button>
                    )}
                    {books.length === 0 && (
                      <button
                        type="button"
                        onClick={handleRestoreSamples}
                        className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-medium bg-amber-100 hover:bg-amber-200 text-amber-900 transition cursor-pointer"
                      >
                        <RotateCcw className="w-3.5 h-3.5" />
                        <span>サンプル読書記録を復元する</span>
                      </button>
                    )}
                  </div>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  {filteredBooks.map((book) => {
                    const quoteCount = Array.isArray(book.quotes) ? book.quotes.length : 0;
                    return (
                      <article
                        key={book.id}
                        onClick={() => setSelectedBookId(book.id)}
                        className="group relative rounded-2xl bg-white border border-stone-200/90 hover:border-amber-700/40 p-5 shadow-sm hover:shadow-md transition-all duration-200 cursor-pointer flex flex-col justify-between"
                      >
                        <div className="flex gap-4">
                          <BookCover
                            title={book.title}
                            author={book.author}
                            coverUrl={book.coverUrl}
                            className="w-24 h-36 group-hover:scale-[1.02] transition-transform"
                          />

                          <div className="flex-1 min-w-0 space-y-2">
                            <div className="flex items-center justify-between gap-2">
                              <div className="flex items-center gap-1.5">
                                <span
                                  className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${
                                    STATUS_STYLES[book.status] || STATUS_STYLES['読了']
                                  }`}
                                >
                                  {book.status}
                                </span>
                                {quoteCount > 0 && (
                                  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-amber-50 text-amber-900 border border-amber-200/70">
                                    <Quote className="w-2.5 h-2.5 text-amber-700" />
                                    引用 {quoteCount}
                                  </span>
                                )}
                              </div>

                              {book.readDate && (
                                <span className="inline-flex items-center gap-1 text-[11px] text-stone-400 font-mono">
                                  <Calendar className="w-3 h-3" />
                                  {book.readDate}
                                </span>
                              )}
                            </div>

                            <h2 className="font-serif text-base sm:text-lg font-bold text-stone-900 group-hover:text-amber-900 transition-colors line-clamp-2 leading-snug">
                              {book.title}
                            </h2>

                            <p className="text-xs text-stone-500 truncate">
                              {book.author || '著者未設定'}
                            </p>

                            {Array.isArray(book.tags) && book.tags.length > 0 && (
                              <div className="flex flex-wrap gap-1 pt-0.5">
                                {book.tags.map((tag) => (
                                  <span
                                    key={tag}
                                    className="px-2 py-0.5 rounded-md text-[11px] bg-stone-100 text-stone-600 border border-stone-200/60"
                                  >
                                    #{tag}
                                  </span>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>

                        <div className="mt-4 pt-3.5 border-t border-stone-100 space-y-2.5">
                          <p className="text-xs sm:text-sm text-stone-600 line-clamp-2 leading-relaxed">
                            {book.summary ||
                              book.overallReview ||
                              book.preQuestion ||
                              '（要約未記入 — クリックして読書ノートを編集・閲覧）'}
                          </p>

                          {(book.essence || book.actionPlan) && (
                            <div className="rounded-lg bg-[#FAF8F5] border border-stone-200/70 px-3 py-2 flex items-start gap-2">
                              {book.essence ? (
                                <>
                                  <Sparkles className="w-3.5 h-3.5 text-amber-700 shrink-0 mt-0.5" />
                                  <p className="text-xs font-serif text-stone-800 line-clamp-1">
                                    <span className="text-stone-400 font-sans mr-1">本質:</span>
                                    {book.essence}
                                  </p>
                                </>
                              ) : (
                                <>
                                  <Compass className="w-3.5 h-3.5 text-amber-700 shrink-0 mt-0.5" />
                                  <p className="text-xs text-stone-700 line-clamp-1">
                                    <span className="text-stone-400 mr-1">行動:</span>
                                    {book.actionPlan}
                                  </p>
                                </>
                              )}
                            </div>
                          )}
                        </div>
                      </article>
                    );
                  })}
                </div>
              )}
            </main>

            <footer className="mt-12 border-t border-stone-200/80 bg-[#F2EFE9] py-6 text-center text-xs text-stone-500">
              <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                <p className="font-serif text-stone-600">私の読書記録 — My Reading Log</p>
                <p className="text-[11px] text-stone-400">
                  すべての記録はお使いのブラウザ（localStorage）に自動保存されます
                </p>
              </div>
            </footer>

            <BookDetailModal
              book={selectedBook}
              onClose={() => setSelectedBookId(null)}
              onEdit={handleOpenEdit}
              onDelete={handleDeleteBook}
              onQuickUpdate={handleQuickUpdate}
            />

            <BookFormModal
              isOpen={isFormOpen}
              onClose={() => {
                setIsFormOpen(false);
                setEditingBook(null);
              }}
              onSave={handleSaveBook}
              initialData={editingBook}
            />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
